name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Typecheck and test the Worker
        run: |
          npm run typecheck
          npm test

      - name: Lint and build the frontend
        run: |
          npm run build
          cd frontend && npm run lint
